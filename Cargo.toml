[package]
name = "llm-router"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "time", "signal"] }
axum = "0.8"
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
url = "2"
rusqlite = { version = "0.37", features = ["bundled", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
futures-util = "0.3"
tikv-jemallocator = "0.6"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"

[profile.release]
lto = "thin"
